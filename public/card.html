<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Мы — Карта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="glass-sound" src="glass-break.mp3" preload="auto"></audio>

  <div id="app" class="page">
    <div style="color: white; text-align: center; margin-top: 50px;">Загрузка...</div>
  </div>
  
  <script>
    const token = new URLSearchParams(location.search).get('t');
    const app = document.getElementById('app');
    let card = null;
    let currentDeadStatus = false;
    let userGender = localStorage.getItem('gender_' + token);
    let roleRevealed = localStorage.getItem('revealed_' + token) === 'true';

    const IMAGES = {
      "true_numer_m": "01a1a425-a8dd-72d6-8da4-465b8e72eba8.jpg",
      "true_numer_f": "01a1a428-a657-74ac-b124-098eebcbfebc (1).jpg",
      "cultist_m": "01a1a44d-a290-7143-91d8-23e925198ecc.jpg",
      "cultist_f": "01a1a44a-9206-7d07-8501-11d84f3c1f48.jpg",
      "order_m": "01a1a460-c164-7efc-b058-e4b9ad86255c.jpg",
      "order_f": "Polish_20261104_052337346.jpg",
      "archivist_m": "01a1a458-e770-74c0-b7c2-5f46367339e6.jpg",
      "archivist_f": "01a1a459-f956-7062-9d07-f9c1cab27a50.jpg",
      "dissident2_m": "01a1a438-9f59-70f0-a68a-e9828fe1f144.jpg",
      "dissident2_f": "Polish_20261104_045710421.jpg"
    };

    if (!token) {
      app.innerHTML = '<p style="color:#889; padding: 20px; text-align:center; font-size: 18px;">Токен не найден.</p>';
    } else {
      start();
    }

    async function start() {
      try {
        const res = await fetch(`/api/cards?t=${token}`);
        const cards = await res.json();
        card = cards.find(c => c.token === token);
        
        if (!card) {
          app.innerHTML = '<p style="color:#889; padding: 20px; text-align:center; font-size: 18px;">Карта не найдена.</p>';
          return;
        }

        if (!userGender) {
          renderGenderSelect();
        } else if (!roleRevealed) {
          renderRevealScreen();
        } else {
          await renderCard();
          startIntervals();
        }
      } catch (err) {
        app.innerHTML = '<p style="color:red; padding: 20px; text-align:center; font-size: 18px;">Ошибка загрузки данных.</p>';
      }
    }

    function renderGenderSelect() {
      app.innerHTML = `
        <div class="card" style="text-align: center; background-image: url('bg-alive.v.png');">
          <div class="card-inner">
            <div class="card__cipher">Идентификация нумера</div>
            <h2 style="margin: 20px 0; color: #a8c4ff;">Укажи свой пол</h2>
            <div style="display: flex; gap: 15px; justify-content: center;">
              <button onclick="setGender('male')" class="btn-gender">Мужчина</button>
              <button onclick="setGender('female')" class="btn-gender">Женщина</button>
            </div>
            <div style="text-align: right; font-size: 10px; color: #445; margin-top: 20px; letter-spacing: 1px;">
              Е. Замятин · «Мы»
            </div>
          </div>
        </div>
      `;
    }

    function renderRevealScreen() {
      app.innerHTML = `
        <div class="card" style="text-align: center; background-image: url('bg-alive.v.png');">
          <div class="card-inner">
            <div class="card__cipher">Нумер ${card.randomCipher || card.cipher}</div>
            <h2 style="margin: 30px 0 10px 0; color: #a8c4ff;">Твоя роль готова</h2>
            <p style="color: #9aa8c0; margin-bottom: 30px; font-size: 15px;">Убедись, что никто не смотрит на твой экран, и нажми кнопку.</p>
            <button onclick="revealRole()" class="btn-gender" style="width: 100%;">Показать мою роль</button>
            <div style="text-align: right; font-size: 10px; color: #445; margin-top: 20px; letter-spacing: 1px;">
              Е. Замятин · «Мы»
            </div>
          </div>
        </div>
      `;
    }

    function revealRole() {
      roleRevealed = true;
      localStorage.setItem('revealed_' + token, 'true');
      start();
    }

    function setGender(gender) {
      userGender = gender;
      localStorage.setItem('gender_' + token, gender);
      fetch(`/api/state/${card.id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ online: true })
      });
      start();
    }

    function resetGender() {
      localStorage.removeItem('gender_' + token);
      localStorage.removeItem('revealed_' + token);
      userGender = null;
      roleRevealed = false;
      renderGenderSelect();
    }

    function startIntervals() {
      // Проверяем статус раз в 10 секунд (снижаем нагрузку)
      setInterval(async () => {
        try {
          const stateRes = await fetch('/api/state');
          const stateData = await stateRes.json();
          const st = (stateData.cards && stateData.cards[card.id]) || { dead: false, personalWinDone: false };
          
          if (st.dead !== currentDeadStatus) {
            currentDeadStatus = st.dead;
            await renderCard();
          }
        } catch (e) {}
      }, 10000);

      setInterval(loadChat, 10000);
    }

    async function renderCard() {
      const stateRes = await fetch('/api/state');
      const stateData = await stateRes.json();
      const allStates = stateData.cards || {};
      const st = allStates[card.id] || { dead: false, personalWinDone: false };
      
      currentDeadStatus = st.dead;
      const bgImage = st.dead ? 'bg-dead.v.png' : 'bg-alive.v.png';
      const isFemale = userGender === 'female';

      document.documentElement.style.setProperty('--bg-url', `url('${bgImage}')`);

      let sideText = "ИНТЕГРАЛ";
      let sideClass = "side--integral";
      if (card.role === "Диссидент" || card.role === "Лидер сопротивления") {
        sideText = "СОПРОТИВЛЕНИЕ";
        sideClass = "side--resistance"; 
      }

      let displayTask = card.task;
      let displayLegend = card.legend;
      if (typeof card.task === 'object' && card.task !== null) displayTask = isFemale ? card.task.f : card.task.m;
      if (typeof card.legend === 'object' && card.legend !== null) displayLegend = isFemale ? card.legend.f : card.legend.m;

      let displayRole = card.role;
      let displayAlibi = card.alibiProfession;
      let displayGoal = card.goalName;

      if (isFemale) {
        if (card.role === "Строитель") displayRole = "Строительница";
        if (card.role === "Диссидент") displayRole = "Диссидентка";
        if (card.role === "Хранитель") displayRole = "Хранительница";
        if (card.alibiProfession === "Учитель") displayAlibi = "Учительница";
        if (card.alibiProfession === "Сварщик") displayAlibi = "Сварщица";
        if (card.alibiProfession === "Программист") displayAlibi = "Программистка";
        if (card.goalNameF) displayGoal = card.goalNameF;
      }

      if (card.role === "Икона сопротивления") {
        displayRole = isFemale ? "Строительница" : "Строитель";
      }

      const wordDeadFinal = isFemale ? 'дезинтегрирована' : 'дезинтегрирован';
      const wordProfession = isFemale ? 'Специальность' : 'Профессия';

      let goalHtml = "";
      if (card.role === "Строитель" || card.role === "Икона сопротивления") {
        const questText = card.quest ? card.quest : "Выполни свой квест";
        goalHtml = `
          <div class="card__goal">
            <h3>Цель ${displayGoal}</h3>
            <p>${questText}</p>
          </div>
        `;
      } else {
        goalHtml = `
          <div class="card__goal">
            <h3>Цель ${displayGoal}</h3>
            <p>${displayTask}</p>
          </div>
        `;
      }

      let massacreCounter = "";
      if (stateData.mode >= 15) {
        if (stateData.night < 3) {
          massacreCounter = `До резни: ${3 - stateData.night} ноч.`;
        } else if (stateData.night >= 3 && !stateData.isMassacre) {
          massacreCounter = `Резня: не состоялась`;
        } else if (stateData.isMassacre) {
          massacreCounter = `🩸 РЕЗНЯ АКТИВНА`;
        }
      }

      app.innerHTML = `
        <div class="card ${st.dead ? 'card--dead' : ''}">
          <div class="card-inner">
            ${!st.dead ? `
              <div class="card__cipher">Нумер ${card.randomCipher || card.cipher}</div>
              <div class="card__portrait">
                <img id="portrait-img" src="" alt="Портрет" style="width:100%; height:100%; object-fit:cover; border-radius: 16px;">
              </div>
              <div class="card__role">${displayRole}</div>
              <div class="card__side ${sideClass}">${sideText}</div>
              
              ${stateData.isMassacre && (card.role === "Диссидент" || card.role === "Лидер сопротивления") ? `
                <div style="margin-top: 10px; padding: 10px; background: rgba(255,0,0,0.2); border: 2px solid #ff0000; border-radius: 8px; text-align: center; color: #ff5252; font-weight: bold; font-size: 14px; animation: pulse 1s infinite;">
                  🩸 РЕЗНЯ: Выберите ДВУХ жертв.
                </div>
              ` : ''}

              <div class="card__alibi"><strong>${wordProfession}:</strong> ${displayAlibi}</div>
              
              ${goalHtml}

              <div class="card__legend">${displayLegend}</div>
              <div class="card__quote">«${card.quote}»</div>

              <!-- БЛОК ГОЛОСОВАНИЯ -->
              <div class="card__vote" id="vote-container" style="display: none; margin-top: 15px; padding: 15px; background: rgba(30, 50, 80, 0.95); border: 1px solid #4a7fff; border-radius: 12px;">
                <h3 style="color: #7aa7ff; margin-bottom: 10px; font-size: 16px; text-align: center;">Голосование открыто</h3>
                <div id="vote-targets" style="display: flex; flex-direction: column; gap: 8px;"></div>
                <button onclick="castVote(null)" style="margin-top: 10px; width: 100%; padding: 10px; background: rgba(120,170,255,0.1); border: 1px solid #4a7fff; border-radius: 8px; color: #fff; cursor: pointer; font-size: 14px;">Воздержаться</button>
              </div>
            ` : `
              <div class="card__portrait dead-portrait">
                <img id="portrait-img" class="main-img" src="" alt="Портрет" style="width:100%; height:100%; object-fit:cover; border-radius: 16px;">
              </div>
              <div class="banner-dead">
                <strong>Ты ${wordDeadFinal}.</strong><br><br>
                Ты больше не можешь говорить или писать.<br>
                Но твой голос в Стеклянном зале всё ещё слышен — <strong>ты можешь голосовать.</strong>
              </div>
            `}

            <!-- ЧАТ (ЕДИНЫЙ ДЛЯ ВСЕХ) -->
            <div class="chat">
              <h4>Связаться с Благодетелем</h4>
              <div class="chat__log" id="log"><div class="chat__empty">Загрузка...</div></div>
              <div class="chat__input">
                <input id="msg" placeholder="Вопрос…" />
                <button id="send">Отправить</button>
              </div>
            </div>
            
            <div style="margin-top: 15px; text-align: center;">
              <button onclick="resetGender()" style="background:none; border:none; color:#55617a; font-size:12px; cursor:pointer; text-decoration: underline;">Сменить пол</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
              <div style="font-size: 11px; color: #ffd47a; font-weight: bold;">
                ${massacreCounter}
              </div>
              <div style="font-size: 10px; color: #445; letter-spacing: 1px;">
                Е. Замятин · «Мы»
              </div>
            </div>
          </div>
        </div>
      `;

      if (card.imageKey) {
        const imgEl = document.getElementById('portrait-img');
        if (imgEl) {
          const genderSuffix = isFemale ? '_f' : '_m';
          const key = card.imageKey + genderSuffix;
          const fileName = IMAGES[key] || `${card.imageKey}${genderSuffix}.png`;
          imgEl.src = `/${fileName}`;
        }
      }

      // Логика голосования
      const voteContainer = document.getElementById('vote-container');
      const voteTargets = document.getElementById('vote-targets');
      
      if (voteContainer && !st.dead) {
        fetch('/api/voting-status').then(r => r.json()).then(status => {
          if (status.isVotingOpen) {
            voteContainer.style.display = 'block';
            fetch('/api/cards').then(r => r.json()).then(allCards => {
              const liveCards = allCards.filter(c => c.id !== card.id && !(allStates[c.id] || {}).dead);
              fetch('/api/votes').then(r => r.json()).then(currentVotes => {
                const myVote = currentVotes[card.id];
                let html = '';
                liveCards.forEach(p => {
                  const isSelected = (myVote === p.id);
                  html += `
                    <button onclick="castVote(${p.id})" style="padding: 10px; background: ${isSelected ? 'rgba(80,255,160,0.5)' : 'rgba(120,170,255,0.2)'}; border: 1px solid ${isSelected ? '#69f0ae' : '#7aa7ff'}; border-radius: 8px; color: #fff; cursor: pointer; font-size: 14px; text-align: left;">
                      ${p.randomCipher || p.cipher} ${isSelected ? '✓' : ''}
                    </button>
                  `;
                });
                voteTargets.innerHTML = html;
              });
            });
          } else {
            voteContainer.style.display = 'none';
          }
        });
      }

      const btn = document.getElementById('send');
      if (btn) {
        btn.onclick = async () => {
          const inp = document.getElementById('msg');
          const text = inp.value.trim();
          if (!text) return;
          inp.value = '';
          await fetch(`/api/chat/${token}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          loadChat();
        };
      }
      
      loadChat();
    }

    function castVote(targetId) {
      if (!confirm(targetId ? 'Подтвердить ваш голос?' : 'Вы уверены, что хотите воздержаться?')) return;
      fetch('/api/vote', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voterId: card.id, targetId: targetId })
      }).then(() => renderCard());
    }

    async function loadChat() {
      const log = document.getElementById('log');
      if (!log) return;
      try {
        const msgs = await (await fetch(`/api/chat/${token}`)).json();
        if (msgs && msgs.length > 0) {
          log.innerHTML = msgs.map(m => `<div class="msg msg--${m.from}">${m.text}</div>`).join('');
          log.scrollTop = log.scrollHeight;
        } else {
          if (log.innerHTML.includes('Загрузка')) {
             log.innerHTML = '<div class="chat__empty">Пока пусто</div>';
          }
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
