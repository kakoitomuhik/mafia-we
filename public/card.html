<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мафия — Твоя роль</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0d14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card-wrap {
      background: #171923;
      border: 1px solid #2d3748;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .phase-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #2d3748;
      margin-bottom: 16px;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      border: 3px solid #4a5568;
      background: #0f111a;
      display: block;
    }
    h1 { font-size: 24px; margin-bottom: 4px; color: #fff; }
    .role-badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      color: #e53e3e;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .desc {
      font-size: 14px;
      color: #a0aec0;
      line-height: 1.5;
      margin-bottom: 16px;
      text-align: left;
      background: #0f111a;
      padding: 12px;
      border-radius: 8px;
    }
    .quote {
      font-style: italic;
      color: #718096;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div id="gamePhase" class="phase-pill">Загрузка...</div>
    <img id="roleImage" class="avatar" src="poet.png" alt="Персонаж">
    <h1 id="playerName">Загрузка...</h1>
    <div id="roleName" class="role-badge">...</div>
    <div id="roleDescription" class="desc">Получение данных с сервера...</div>
    <div id="roleQuote" class="quote"></div>
  </div>

  <script src="/card.js"></script>
</body>
</html>
