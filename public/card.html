<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Единое Государство — Личная карточка нумера</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .id-card {
      background: #141b2d;
      border: 1px solid #233054;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .phase-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      background: #233054;
      color: #63b3ed;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 14px;
      border: 3px solid #63b3ed;
      background: #0b0f19;
      display: block;
    }
    h1 { font-size: 24px; margin-bottom: 4px; color: #fff; }
    .role-title {
      font-size: 15px;
      font-weight: 700;
      color: #63b3ed;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .block {
      background: #0d1322;
      border: 1px solid #233054;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
      text-align: left;
    }
    .block b { color: #63b3ed; display: block; margin-bottom: 2px; }
    .quote {
      font-style: italic;
      color: #718096;
      font-size: 12px;
      margin-top: 14px;
    }
    .error-box {
      color: #fc8181;
      padding: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="id-card" id="cardBox">
    <div id="gamePhase" class="phase-tag">Связь со Скрижалью...</div>
    <img id="playerImage" class="avatar" src="/poet.png" alt="Шифр">
    <h1 id="playerName">Нумер...</h1>
    <div id="playerRole" class="role-title">...</div>

    <div class="block">
      <b>Личное дело:</b>
      <span id="playerDesc">Загрузка сведений...</span>
    </div>

    <div class="block">
      <b>Личная цель нумера (Квест):</b>
      <span id="playerQuest">Загрузка цели...</span>
    </div>

    <div class="block">
      <b>Ночное действие:</b>
      <span id="playerNight">Загрузка предписания...</span>
    </div>

    <div id="playerQuote" class="quote"></div>
  </div>

  <script src="/card.js"></script>
</body>
</html>
