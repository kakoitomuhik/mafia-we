<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Единое Государство — Карточка Нумера</title>
  <style>
    :root {
      --bg: #070b14;
      --glass: rgba(14, 22, 40, 0.8);
      --border: rgba(96, 213, 255, 0.3);
      --cyan: #60d5ff;
      --red: #ff5277;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg) radial-gradient(circle at 50% 15%, #10223a 0%, #060910 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .wrapper {
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      position: relative;
    }
    .seat-badge {
      display: inline-block;
      background: var(--cyan);
      color: #060912;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .phase-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11px;
      border: 1px solid var(--border);
      color: var(--cyan);
      margin-bottom: 12px;
    }
    .avatar-box {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      margin: 0 auto 12px;
      overflow: hidden;
      background: #000;
    }
    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 { font-size: 22px; color: #fff; margin-bottom: 2px; }
    .role-text { font-size: 15px; color: var(--cyan); font-weight: bold; margin-bottom: 12px; }
    .quote-box {
      font-style: italic;
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      border-left: 2px solid var(--cyan);
      border-radius: 4px;
      text-align: left;
      margin-bottom: 12px;
    }
    .block {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .block b { color: var(--cyan); display: block; margin-bottom: 2px; }

    .dead-banner {
      display: none;
      background: rgba(255, 82, 119, 0.2);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
    }

    /* ЧАТ */
    .chat-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 380px;
    }
    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chat-bubble {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .chat-bubble.system {
      border-color: rgba(96, 213, 255, 0.4);
      color: var(--cyan);
    }
    .chat-input-bar {
      display: flex;
      gap: 6px;
    }
    .chat-input-bar input {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-size: 13px;
    }
    .send-btn {
      background: rgba(96, 213, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      border-radius: 6px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="glass-card">
      <div id="seatBadge" class="seat-badge">МЕСТО № ...</div>
      <div><span id="phaseBadge" class="phase-badge">Синхронизация...</span></div>
      
      <div id="deadNotice" class="dead-banner">ВЫ КАЗНЕНЫ ПОД КОЛОКОЛОМ БЛАГОДЕТЕЛЯ</div>

      <div class="avatar-box">
        <img id="avatarImg" src="/poet_m.png" alt="Аватар">
      </div>

      <h1 id="pName">Нумер...</h1>
      <div id="pRole" class="role-text">Роль: ...</div>
      <div id="pQuote" class="quote-box">«...»</div>

      <div class="block">
        <b>Цель Нумера (Квест победы):</b>
        <span id="pQuest">-</span>
      </div>

      <div class="block">
        <b>Ночное предписание:</b>
        <span id="pNight">-</span>
      </div>
    </div>

    <!-- Чат игрока -->
    <div class="chat-card">
      <div style="font-size: 13px; font-weight: bold; color: var(--cyan); margin-bottom: 8px;">МЕМБРАНА ГОРОДА (ЧАТ)</div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input-bar">
        <input type="text" id="playerMsg" placeholder="Сообщение в эфир..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button class="send-btn" onclick="sendMsg()">></button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const seat = params.get('seat');
    const token = params.get('t');

    let currentCard = null;

    async function fetchCard() {
      try {
        const query = seat ? `seat=${seat}` : `t=${token}`;
        const res = await fetch(`/api/cards?${query}`);
        if (!res.ok) throw new Error('Не найдено');
        const c = await res.json();
        currentCard = c;

        document.getElementById('seatBadge').textContent = `МЕСТО № ${c.seat} • ШИФР: ${c.cipher}`;
        document.getElementById('pName').textContent = `${c.name} (${c.cipher})`;
        document.getElementById('pRole').textContent = `Роль: ${c.role}`;
        document.getElementById('pQuote').textContent = c.quote;
        document.getElementById('pQuest').textContent = c.quest;
        document.getElementById('pNight').textContent = c.night;

        let ph = 'День';
        if (c.gamePhase === 'voting') ph = 'Голосование';
        if (c.gamePhase === 'night') ph = 'Личный час (Ночь)';
        document.getElementById('phaseBadge').textContent = `${ph} • Раунд ${c.round}`;

        const deadBox = document.getElementById('deadNotice');
        deadBox.style.display = c.alive ? 'none' : 'block';

        const img = document.getElementById('avatarImg');
        img.src = `/${c.image}.png`;
        img.onerror = () => { img.src = '/poet_m.png'; };
      } catch (err) {
        document.getElementById('pName').textContent = 'QR-код не распознан';
      }
    }

    async function fetchChat() {
      try {
        const res = await fetch('/api/chat');
        const msgs = await res.json();
        const box = document.getElementById('chatMsgs');
        box.innerHTML = msgs.map(m => `
          <div class="chat-bubble ${m.system ? 'system' : ''}">
            <div style="font-weight:bold; font-size:11px; margin-bottom:2px; color: #60d5ff;">${m.author} <span style="font-weight:normal; font-size:9px; color:#64748b;">${m.time}</span></div>
            <div>${m.text}</div>
          </div>
        `).join('');
      } catch (e) {}
    }

    async function sendMsg() {
      const input = document.getElementById('playerMsg');
      const val = input.value.trim();
      if (!val || !currentCard) return;

      if (!currentCard.alive) {
        alert('Казнённый нумер не может говорить через мембрану!');
        return;
      }

      await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          seat: currentCard.seat,
          token: currentCard.token,
          text: val
        })
      });
      input.value = '';
      fetchChat();
    }

    fetchCard();
    fetchChat();
    setInterval(() => {
      fetchCard();
      fetchChat();
    }, 3000);
  </script>
</body>
</html>
