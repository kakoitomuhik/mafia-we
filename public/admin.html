<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бюро Благодетеля — Управление 10 местами</title>
  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(16, 24, 44, 0.75);
      --border: rgba(96, 213, 255, 0.25);
      --cyan: #60d5ff;
      --red: #ff5376;
      --green: #48bb78;
      --gold: #ecc94b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg) radial-gradient(circle at 50% 10%, #112038 0%, #060912 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 20px; color: #fff; letter-spacing: 0.5px; }
    .phase-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(96, 213, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      text-transform: uppercase;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .glass-btn:hover { background: rgba(96, 213, 255, 0.2); border-color: var(--cyan); }
    .btn-day { color: var(--gold); border-color: var(--gold); }
    .btn-vote { color: #ed8936; border-color: #ed8936; }
    .btn-night { color: #9f7aea; border-color: #9f7aea; }
    .btn-danger { color: var(--red); border-color: var(--red); }
    .btn-shuffle { color: var(--cyan); border-color: var(--cyan); font-weight: bold; }

    .control-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .seats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .seat-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
      position: relative;
    }
    .seat-card.dead {
      opacity: 0.6;
      border-color: rgba(255, 83, 118, 0.5);
      background: rgba(30, 10, 15, 0.6);
    }
    .seat-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .seat-number-tag {
      background: var(--cyan);
      color: #060912;
      font-weight: 900;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .seat-cipher {
      font-size: 13px;
      font-weight: bold;
      color: #cbd5e1;
    }
    .seat-role {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }
    .seat-meta {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .seat-quest {
      background: rgba(0,0,0,0.3);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #a0aec0;
      margin-bottom: 10px;
    }

    .status-btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .status-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: bold;
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
    }
    .status-btn.alive.active {
      background: rgba(72, 187, 120, 0.2);
      border-color: var(--green);
      color: var(--green);
    }
    .status-btn.dead.active {
      background: rgba(255, 83, 118, 0.2);
      border-color: var(--red);
      color: var(--red);
    }

    .copy-qr-link {
      width: 100%;
      background: rgba(96, 213, 255, 0.1);
      border: 1px dashed var(--cyan);
      color: var(--cyan);
      padding: 6px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ЧАТ */
    .chat-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 640px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .chat-msg {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .chat-msg.system {
      border-color: rgba(96, 213, 255, 0.3);
      background: rgba(16, 40, 70, 0.3);
      color: var(--cyan);
    }
    .chat-author {
      font-weight: bold;
      color: var(--cyan);
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
    }
    .chat-time { font-size: 10px; color: #64748b; font-weight: normal; }
    .chat-input-row {
      display: flex;
      gap: 6px;
    }
    .chat-input {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Бюро Благодетеля (Единое Государство)</h1>
        <small style="color: #718096;">10 постоянных QR-мест стола • Управление и мониторинг</small>
      </div>
      <div id="statusBadge" class="phase-badge">Синхронизация...</div>
    </header>

    <div class="control-bar">
      <button class="glass-btn btn-day" onclick="setPhase('day')">☀️ День</button>
      <button class="glass-btn btn-vote" onclick="setPhase('voting')">🗳️ Голосование</button>
      <button class="glass-btn btn-night" onclick="setPhase('night')">🌙 Личный час (Ночь)</button>
      <button class="glass-btn btn-shuffle" onclick="shuffleGame()">🎲 Перемешать роли по местам</button>
      <button class="glass-btn btn-danger" style="margin-left: auto;" onclick="resetGame()">🔄 Полный сброс</button>
    </div>

    <div class="main-grid">
      <!-- 10 мест -->
      <div>
        <h2 style="font-size: 15px; margin-bottom: 12px; color: #a0aec0;">МЕСТА И КАРТОЧКИ СТОЛА (1..10):</h2>
        <div class="seats-grid" id="seatsContainer">Загрузка карточек мест...</div>
      </div>

      <!-- Чат фонографа -->
      <div class="chat-panel">
        <h2 style="font-size: 15px; margin-bottom: 12px; color: #a0aec0;">МЕМБРАНА СВЯЗИ (ОБЩИЙ ЧАТ):</h2>
        <div class="chat-messages" id="chatBox"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" class="chat-input" placeholder="Уведомление Благодетеля..." onkeydown="if(event.key==='Enter') sendAdminMsg()">
          <button class="glass-btn" onclick="sendAdminMsg()">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const origin = window.location.origin;

    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const state = await res.json();
        const badge = document.getElementById('statusBadge');
        let pText = 'ДЕНЬ';
        if (state.phase === 'voting') pText = 'ГОЛОСОВАНИЕ';
        if (state.phase === 'night') pText = 'НОЧЬ (ЛИЧНЫЙ ЧАС)';
        badge.textContent = `${pText} • РАУНД ${state.round}`;
      } catch (e) {}
    }

    async function loadSeats() {
      try {
        const res = await fetch('/api/admin/cards');
        const seats = await res.json();
        const box = document.getElementById('seatsContainer');

        box.innerHTML = seats.map(s => {
          const qrLink = `${origin}/card.html?seat=${s.seat}`;
          return `
            <div class="seat-card ${s.alive ? '' : 'dead'}">
              <div>
                <div class="seat-card-top">
                  <span class="seat-number-tag">МЕСТО № ${s.seat}</span>
                  <span class="seat-cipher">${s.cipher}</span>
                </div>
                <div class="seat-role">${s.name} (${s.role})</div>
                <div class="seat-meta">Фракция: <b>${s.team === 'resistance' ? 'Мефи (Сопротивление)' : 'Строители'}</b></div>
                <div class="seat-quest"><b>Квест:</b> ${s.quest || '-'}</div>
              </div>

              <div>
                <div class="status-btn-group">
                  <button class="status-btn alive ${s.alive ? 'active' : ''}" onclick="toggleStatus(${s.seat}, true)">ЖИВ</button>
                  <button class="status-btn dead ${!s.alive ? 'active' : ''}" onclick="toggleStatus(${s.seat}, false)">КАЗНЁН</button>
                </div>
                <button class="copy-qr-link" onclick="copyLink('${qrLink}')">🔗 Скопировать ссылку QR Места №${s.seat}</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadChat() {
      try {
        const res = await fetch('/api/chat');
        const msgs = await res.json();
        const box = document.getElementById('chatBox');
        box.innerHTML = msgs.map(m => `
          <div class="chat-msg ${m.system ? 'system' : ''}">
            <div class="chat-author">
              <span>${m.author} [${m.role}]</span>
              <span class="chat-time">${m.time}</span>
            </div>
            <div>${m.text}</div>
          </div>
        `).join('');
      } catch (e) {}
    }

    async function sendAdminMsg() {
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;

      await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author: 'БЛАГОДЕТЕЛЬ', text: val })
      });
      input.value = '';
      loadChat();
    }

    window.setPhase = async function(phase) {
      await fetch('/api/admin/phase', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phase })
      });
      loadState();
      loadChat();
    };

    window.toggleStatus = async function(seat, alive) {
      await fetch('/api/admin/player-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seat, alive })
      });
      loadSeats();
      loadChat();
    };

    window.shuffleGame = async function() {
      if (confirm('Перемешать все роли по 10 местам? Физические QR-коды на карточках стола останутся прежними!')) {
        await fetch('/api/admin/randomize', { method: 'POST' });
        loadSeats();
        loadChat();
      }
    };

    window.resetGame = async function() {
      if (confirm('Сбросить состояние игры?')) {
        await fetch('/api/admin/reset', { method: 'POST' });
        loadState();
        loadSeats();
        loadChat();
      }
    };

    window.copyLink = function(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('Ссылка на QR-код этого места скопирована!');
      }).catch(() => prompt('Скопируйте ссылку:', url));
    };

    loadState();
    loadSeats();
    loadChat();
    setInterval(() => {
      loadState();
      loadChat();
    }, 3000);
  </script>
</body>
</html>
