<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Благодетель — панель</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin">
    <h1>Благодетель</h1>
    
    <div class="tabs">
      <button class="tab tab--active" id="btn-players" onclick="showTab('players')">Игроки</button>
      <button class="tab" id="btn-chats" onclick="showTab('chats')">Вопросы</button>
      <button class="tab" id="btn-votes" onclick="showTab('votes')">Голосование</button>
      <button class="tab" id="btn-notes" onclick="showTab('notes')">Заметки</button>
    </div>
    
    <!-- Вкладка Игроки -->
    <div id="tab-players" class="tab-panel active">
      <div class="mode-control">
        <label>Режим игры:</label>
        <select id="mode-select">
          <option value="10">10 игроков</option>
          <option value="15">15 игроков</option>
          <option value="20">20 игроков</option>
        </select>
        <button id="next-night" class="btn-ghost" style="border-color: #4a7fff; color: #4a7fff; margin: 0;">Следующая ночь 🌙</button>
        <button id="toggle-vote" class="btn-ghost" style="border-color: #ffd47a; color: #ffd47a; margin: 0;">Открыть голосование</button>
      </div>
      <div id="list" class="admin__list">Загрузка...</div>
      <div class="control-buttons">
        <button id="reset" class="btn-ghost danger">Сбросить игру</button>
      </div>
    </div>
    
    <!-- Вкладка Вопросы -->
    <div id="tab-chats" class="tab-panel hidden">
      <div id="chats" class="chats">Загрузка...</div>
    </div>

    <!-- Вкладка Голосование -->
    <div id="tab-votes" class="tab-panel hidden">
      <div id="votes-list" class="admin__list">Загрузка...</div>
      <div class="control-buttons">
        <button id="reset-votes" class="btn-ghost danger">Сбросить голоса</button>
      </div>
    </div>

    <!-- Вкладка Заметки -->
    <div id="tab-notes" class="tab-panel hidden">
      <div class="notes-block" style="max-width: 100%;">
        <textarea class="notes-textarea" id="global-notes" placeholder="Записывайте сюда всё..."></textarea>
        <button class="btn-save-notes" onclick="saveGlobalNotes()">Сохранить заметки</button>
      </div>
    </div>
  </div>

  <script>
    // Элементы
    const listEl = document.getElementById('list');
    const chatsEl = document.getElementById('chats');
    const votesListEl = document.getElementById('votes-list');
    const globalNotesEl = document.getElementById('global-notes');
    const modeSelect = document.getElementById('mode-select');
    
    // Данные
    let cardsData = [];
    let stateData = { cards: {}, night: 1, mode: 10 };
    let chatData = [];
    let votesData = {};
    let lastChatJSON = '';
    let votingStatus = false;

    // 1. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (просто и надежно)
    function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
      document.querySelectorAll('.tab-panel').forEach(p => {
        p.classList.remove('active');
        p.classList.add('hidden');
      });
      
      document.getElementById('btn-' + tabName).classList.add('tab--active');
      
      const targetPanel = document.getElementById('tab-' + tabName);
      targetPanel.classList.remove('hidden');
      targetPanel.classList.add('active');
      
      if (tabName === 'chats') renderChats();
      if (tabName === 'votes') renderVotes();
      if (tabName === 'notes') globalNotesEl.value = stateData['global_notes'] || "";
    }

    // 2. ЗАГРУЗКА ДАННЫХ
    async function loadData() {
      try {
        const resCards = await fetch('/api/cards');
        if (resCards.ok) cardsData = await resCards.json();
        
        const resState = await fetch('/api/state');
        if (resState.ok) stateData = await resState.json();
        
        modeSelect.value = stateData.mode || 10;
        renderPlayers();

        const resChat = await fetch('/api/chat');
        if (resChat.ok) {
          const newChatData = await resChat.json();
          const newChatJSON = JSON.stringify(newChatData);
          if (newChatJSON !== lastChatJSON) {
            chatData = newChatData;
            lastChatJSON = newChatJSON;
            renderChats();
          }
        }

        const voteRes = await fetch('/api/voting-status');
        if (voteRes.ok) {
          const voteStatus = await voteRes.json();
          votingStatus = voteStatus.isVotingOpen;
          
          const toggleBtn = document.getElementById('toggle-vote');
          if (votingStatus) {
            toggleBtn.innerText = "Закрыть голосование";
            toggleBtn.style.borderColor = "#ff5252";
            toggleBtn.style.color = "#ff9a9a";
          } else {
            toggleBtn.innerText = "Открыть голосование";
            toggleBtn.style.borderColor = "#ffd47a";
            toggleBtn.style.color = "#ffd47a";
          }
        }
      } catch (e) {
        console.error("Ошибка при загрузке:", e);
      }
    }

    // 3. ОТРИСОВКА ИГРОКОВ
    function renderPlayers() {
      if (!cardsData || cardsData.length === 0) {
        listEl.innerHTML = '<span style="color:#889">Нет данных. Нажмите "Сбросить игру".</span>';
        return;
      }
      listEl.innerHTML = cardsData.map(c => {
        const st = stateData.cards[c.id] || { dead: false, personalWinDone: false };
        const statusDot = st.online ? '<span style="color:#69f0ae; margin-right:8px;">●</span>' : '<span style="color:#55617a; margin-right:8px;">○</span>';
        const extraInfo = c.quest ? ` | Квест: ${c.quest}` : '';
        
        let displayRole = c.role;
        if (c.role === "Икона сопротивления") displayRole = "Строитель (Икона)";

        return `
          <div class="admin__row">
            <div>
              <strong>${statusDot} ${c.randomCipher || c.cipher} · ${displayRole}</strong>
              <small>${c.alibiProfession || '—'}${extraInfo}</small>
            </div>
            <button class="btn-dead ${st.dead ? 'on' : ''}" onclick="toggleState(${c.id}, 'dead', ${!st.dead})">
              ${st.dead ? 'Мёртв' : 'Жив'}
            </button>
            <button class="btn-win ${st.personalWinDone ? 'on' : ''}" onclick="toggleState(${c.id}, 'personalWinDone', ${!st.personalWinDone})">
              ${st.personalWinDone ? 'Победа' : '—'}
            </button>
          </div>
        `;
      }).join('');
    }

    // 4. ОТРИСОВКА ЧАТА
    function renderChats() {
      if (!chatsEl) return;
      const withMsgs = chatData.filter(c => c.messages && c.messages.length > 0);
      if (withMsgs.length === 0) {
        chatsEl.innerHTML = '<div style="color:#7a879e; padding:20px; text-align:center;">Пока никто не задал вопросов.</div>';
        return;
      }

      chatsEl.innerHTML = withMsgs.map(c => {
        const msgsHtml = c.messages.map(m => `
          <div class="msg msg--${m.from}">
            ${m.text}
            <small>${new Date(m.ts).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'})}</small>
          </div>
        `).join('');

        let chatDisplayRole = c.role === "Икона сопротивления" ? "Строитель" : c.role;

        return `
          <div class="chat-block">
            <div class="chat-block__head">
              <strong>${c.randomCipher || c.cipher} · ${chatDisplayRole}</strong> <small>(${c.alibiProfession || '—'})</small>
            </div>
            <div class="chat__log" style="max-height:200px; overflow-y:auto; margin-bottom:10px;">
              ${msgsHtml}
            </div>
            <div class="chat__input">
              <input type="text" id="reply-${c.token}" placeholder="Ответить..." />
              <button onclick="sendReply('${c.token}')">Ответить</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function sendReply(token) {
      const inp = document.getElementById('reply-' + token);
      const text = inp.value.trim();
      if (!text) return;
      await fetch(`/api/chat/${token}/reply`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      loadData();
    }

    // 5. ОТРИСОВКА ГОЛОСОВАНИЯ
    async function renderVotes() {
      try {
        const res = await fetch('/api/votes');
        if (!res.ok) throw new Error('Ошибка загрузки');
        votesData = await res.json();
        
        const allCards = cardsData;
        if (!allCards || allCards.length === 0) {
          votesListEl.innerHTML = '<span style="color:#889">Нет данных.</span>';
          return;
        }

        let html = '';
        allCards.forEach(c => {
          if ((stateData.cards[c.id] || {}).dead) return;

          const myVote = votesData[c.id];
          let voteText = "Не голосовал";
          
          if (myVote !== undefined) {
            if (myVote === null) voteText = "Воздержался";
            else {
              const target = allCards.find(t => t.id === myVote);
              voteText = target ? `За ${target.randomCipher || target.cipher}` : "Неизвестно";
            }
          }

          const displayRole = c.role === "Икона сопротивления" ? "Строитель (Икона)" : c.role;

          html += `
            <div class="admin__row" style="grid-template-columns: 1fr auto;">
              <div>
                <strong>${c.randomCipher || c.cipher} · ${displayRole}</strong>
                <small>Голос: <span style="color: #69f0ae;">${voteText}</span></small>
              </div>
            </div>
          `;
        });
        votesListEl.innerHTML = html;
      } catch(e) {
        votesListEl.innerHTML = `<span style="color:red">Ошибка: ${e.message}</span>`;
      }
    }

    // Вспомогательные функции
    async function saveGlobalNotes() {
      const text = globalNotesEl.value;
      await fetch(`/api/state/global_notes`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes: text })
      });
      const btn = event.target;
      const oldText = btn.innerText;
      btn.innerText = "Сохранено!";
      btn.style.background = "rgba(80,255,160,0.2)";
      setTimeout(() => { btn.innerText = oldText; btn.style.background = ""; }, 1500);
    }

    async function toggleState(id, field, value) {
      await fetch(`/api/state/${id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value })
      });
      loadData();
    }

    modeSelect.onchange = async (e) => {
      const newMode = e.target.value;
      await fetch('/api/set-mode', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: parseInt(newMode) })
      });
      loadData();
    };

    document.getElementById('next-night').onclick = async () => {
      await fetch('/api/next-night', { method: 'POST' });
      loadData();
    };

    document.getElementById('toggle-vote').onclick = async () => {
      await fetch('/api/voting-status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isVotingOpen: !votingStatus })
      });
      loadData();
    };

    document.getElementById('reset').onclick = async () => {
      if (!confirm('Сбросить игру и раздать новые роли?')) return;
      lastChatJSON = ''; 
      await fetch('/api/reset', { method: 'POST' });
      loadData();
    };

    document.getElementById('reset-votes').onclick = async () => {
      await fetch('/api/reset-votes', { method: 'POST' });
      renderVotes();
    };

    // Запуск
    loadData();
    setInterval(loadData, 3000);
  </script>
</body>
</html>
