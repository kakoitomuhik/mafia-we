<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Благодетель — панель</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin">
    <h1>Благодетель</h1>
    
    <div class="tabs">
      <button class="tab tab--active" id="btn-players">Игроки</button>
      <button class="tab" id="btn-chats">Вопросы</button>
      <button class="tab" id="btn-votes">Голосование</button>
      <button class="tab" id="btn-notes">Заметки</button>
    </div>
    
    <div id="tab-players" class="tab-panel active">
      <div class="mode-control">
        <label>Режим игры:</label>
        <select id="mode-select">
          <option value="10">10 игроков</option>
          <option value="15">15 игроков</option>
          <option value="20">20 игроков</option>
        </select>
        <button id="next-night" class="btn-ghost" style="border-color: #4a7fff; color: #4a7fff; margin: 0;">Следующая ночь 🌙</button>
      </div>

      <div id="list" class="admin__list">Загрузка...</div>
      
      <div class="control-buttons">
        <button id="reset" class="btn-ghost danger">Сбросить игру</button>
      </div>
    </div>
    
    <div id="tab-chats" class="tab-panel hidden">
      <div id="chats" class="chats">Загрузка...</div>
    </div>

    <div id="tab-votes" class="tab-panel hidden">
      <div id="votes-list" class="admin__list">Загрузка...</div>
      <div class="control-buttons">
        <button id="reset-votes" class="btn-ghost danger">Сбросить голоса</button>
      </div>
    </div>

    <div id="tab-notes" class="tab-panel hidden">
      <div class="notes-block" style="max-width: 100%;">
        <textarea class="notes-textarea" id="global-notes" placeholder="Записывайте сюда всё..."></textarea>
        <button class="btn-save-notes" onclick="saveGlobalNotes()">Сохранить заметки</button>
      </div>
    </div>
  </div>

  <script>
    const listEl = document.getElementById('list');
    const chatsEl = document.getElementById('chats');
    const votesListEl = document.getElementById('votes-list');
    const globalNotesEl = document.getElementById('global-notes');
    const modeSelect = document.getElementById('mode-select');
    
    let cardsData = [];
    let stateData = { cards: {}, night: 1, mode: 10 };
    let chatData = [];
    let votesData = {};
    let lastChatJSON = '';

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));

      if (tabName === 'players') {
        document.getElementById('btn-players').classList.add('tab--active');
        document.getElementById('tab-players').classList.remove('hidden');
      } else if (tabName === 'chats') {
        document.getElementById('btn-chats').classList.add('tab--active');
        document.getElementById('tab-chats').classList.remove('hidden');
      } else if (tabName === 'votes') {
        document.getElementById('btn-votes').classList.add('tab--active');
        document.getElementById('tab-votes').classList.remove('hidden');
        renderVotes();
      } else if (tabName === 'notes') {
        document.getElementById('btn-notes').classList.add('tab--active');
        document.getElementById('tab-notes').classList.remove('hidden');
        globalNotesEl.value = stateData['global_notes'] || "";
      }
    }

    document.getElementById('btn-players').onclick = () => switchTab('players');
    document.getElementById('btn-chats').onclick = () => switchTab('chats');
    document.getElementById('btn-votes').onclick = () => switchTab('votes');
    document.getElementById('btn-notes').onclick = () => switchTab('notes');

    async function loadData() {
      try {
        cardsData = await (await fetch('/api/cards')).json();
        stateData = await (await fetch('/api/state')).json();
        
        const newChatData = await (await fetch('/api/chat')).json();
        const newChatJSON = JSON.stringify(newChatData);
        if (newChatJSON !== lastChatJSON) {
          chatData = newChatData;
          lastChatJSON = newChatJSON;
          renderChats();
        }

        modeSelect.value = stateData.mode || 10;
        renderPlayers();
      } catch (e) {
        listEl.innerHTML = '<span style="color:red">Ошибка загрузки данных.</span>';
      }
    }

    function renderPlayers() {
      listEl.innerHTML = cardsData.map(c => {
        const st = stateData.cards[c.id] || { dead: false, personalWinDone: false };
        const statusDot = st.online ? '<span style="color:#69f0ae; margin-right:8px;">●</span>' : '<span style="color:#55617a; margin-right:8px;">○</span>';
        const extraInfo = c.quest ? ` | Квест: ${c.quest}` : '';
        
        let displayRole = c.role;
        if (c.role === "Икона сопротивления") displayRole = "Строитель (Икона)";

        return `
          <div class="admin__row">
            <div>
              <strong>${statusDot} ${c.randomCipher || c.cipher} · ${displayRole}</strong>
              <small>${c.alibiProfession || '—'}${extraInfo}</small>
            </div>
            <button class="btn-dead ${st.dead ? 'on' : ''}" onclick="toggleState(${c.id}, 'dead', ${!st.dead})">
              ${st.dead ? 'Мёртв' : 'Жив'}
            </button>
            <button class="btn-win ${st.personalWinDone ? 'on' : ''}" onclick="toggleState(${c.id}, 'personalWinDone', ${!st.personalWinDone})">
              ${st.personalWinDone ? 'Победа' : '—'}
            </button>
          </div>
        `;
      }).join('');
    }

    async function renderVotes() {
      try {
        votesData = await (await fetch('/api/votes')).json();
        const allCards = cardsData;
        
        let html = '';
        allCards.forEach(c => {
          if ((stateData.cards[c.id] || {}).dead) return;

          const myVote = votesData[c.id];
          let voteText = "Не голосовал";
