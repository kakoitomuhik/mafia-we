<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Благодетель — панель</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin">
    <h1>Благодетель</h1>
    
    <div class="tabs">
      <button class="tab tab--active" id="btn-players" onclick="showTab('players')">Игроки</button>
      <button class="tab" id="btn-chats" onclick="showTab('chats')">Вопросы</button>
      <button class="tab" id="btn-votes" onclick="showTab('votes')">Голосование</button>
      <button class="tab" id="btn-notes" onclick="showTab('notes')">Заметки</button>
    </div>
    
    <div id="tab-players" class="tab-panel active">
      <div class="mode-control">
        <label>Режим игры:</label>
        <select id="mode-select">
          <option value="10">10 игроков</option>
          <option value="15">15 игроков</option>
          <option value="20">20 игроков</option>
        </select>
        <button id="next-night" class="btn-ghost" style="border-color: #4a7fff; color: #4a7fff; margin: 0;">Следующая ночь 🌙</button>
        <button id="toggle-vote" class="btn-ghost" style="border-color: #ffd47a; color: #ffd47a; margin: 0;">Открыть/Закрыть голосование</button>
      </div>

      <div style="margin-bottom: 15px;">
        <button onclick="loadData()" style="background: #4a7fff; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%;">
          🔄 Обновить данные
        </button>
      </div>

      <div id="list" class="admin__list">Нажмите "Обновить данные"</div>
      
      <div class="control-buttons">
        <button id="reset" class="btn-ghost danger">Сбросить игру</button>
      </div>
    </div>
    
    <div id="tab-chats" class="tab-panel hidden">
      <div id="chats" class="chats">Нажмите "Обновить данные"</div>
    </div>

    <div id="tab-votes" class="tab-panel hidden">
      <div id="votes-list" class="admin__list">Нажмите "Обновить данные"</div>
      <div class="control-buttons">
        <button id="reset-votes" class="btn-ghost danger">Сбросить голоса</button>
      </div>
    </div>

    <div id="tab-notes" class="tab-panel hidden">
      <div class="notes-block" style="max-width: 100%;">
        <textarea class="notes-textarea" id="global-notes" placeholder="Записывайте сюда всё..."></textarea>
        <button class="btn-save-notes" onclick="saveGlobalNotes()">Сохранить заметки</button>
      </div>
    </div>
  </div>

  <script>
    let cardsData = [];
    let stateData = { cards: {}, night: 1, mode: 10, isMassacre: false };
    let chatData = [];
    let votesData = {};
    let votingStatus = false;

    function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      
      document.getElementById('btn-' + tabName).classList.add('tab--active');
      document.getElementById('tab-' + tabName).classList.remove('hidden');
      
      if (tabName === 'chats') renderChats();
      if (tabName === 'votes') renderVotes();
      if (tabName === 'notes') document.getElementById('global-notes').value = stateData['global_notes'] || "";
    }

    // Загружаем ВСЕ данные по нажатию кнопки
    async function loadData() {
      try {
        const resCards = await fetch('/api/cards');
        if (resCards.ok) cardsData = await resCards.json();

        const resState = await fetch('/api/state');
        if (resState.ok) stateData = await resState.json();

        const resChat = await fetch('/api/chat');
        if (resChat.ok) chatData = await resChat.json();

        const voteRes = await fetch('/api/voting-status');
        if (voteRes.ok) {
          const vs = await voteRes.json();
          votingStatus = vs.isVotingOpen;
        }

        document.getElementById('mode-select').value = stateData.mode || 10;
        renderPlayers();
        renderChats();
        renderVotes();

        if (votingStatus) {
          document.getElementById('toggle-vote').style.borderColor = "#ff5252";
          document.getElementById('toggle-vote').style.color = "#ff9a9a";
        } else {
          document.getElementById('toggle-vote').style.borderColor = "#ffd47a";
          document.getElementById('toggle-vote').style.color = "#ffd47a";
        }

      } catch (e) {
        alert("Ошибка загрузки данных с сервера!");
      }
    }

    function renderPlayers() {
      const listEl = document.getElementById('list');
      if (!cardsData || cardsData.length === 0) {
        listEl.innerHTML = '<span style="color:#889">Нет данных. Нажмите "Сбросить игру".</span>';
        return;
      }
      
      listEl.innerHTML = cardsData.map(c => {
        const st = stateData.cards[c.id] || { dead: false, personalWinDone: false };
        const dot = st.online ? '<span style="color:#69f0ae; margin-right:8px;">●</span>' : '<span style="color:#55617a; margin-right:8px;">○</span>';
        const role = c.role === "Икона сопротивления" ? "Строитель (Икона)" : c.role;
        
        return `
          <div class="admin__row">
            <div>
              <strong>${dot} ${c.randomCipher || c.cipher} · ${role}</strong>
              <small>${c.alibiProfession || '—'}</small>
            </div>
            <button class="btn-dead ${st.dead ? 'on' : ''}" onclick="toggleState(${c.id}, 'dead', ${!st.dead})">
              ${st.dead ? 'Мёртв' : 'Жив'}
            </button>
            <button class="btn-win ${st.personalWinDone ? 'on' : ''}" onclick="toggleState(${c.id}, 'personalWinDone', ${!st.personalWinDone})">
              ${st.personalWinDone ? 'Победа' : '—'}
            </button>
          </div>
        `;
      }).join('');
    }

    function renderChats() {
      const chatsEl = document.getElementById('chats');
      if (!chatsEl) return;
      const withMsgs = chatData.filter(c => c.messages && c.messages.length > 0);
      
      if (withMsgs.length === 0) {
        chatsEl.innerHTML = '<div style="color:#7a879e; padding:20px; text-align:center;">Пока никто не задал вопросов.</div>';
        return;
      }

      chatsEl.innerHTML = withMsgs.map(c => {
        const msgsHtml = c.messages.map(m => `
          <div class="msg msg--${m.from}">${m.text}</div>
        `).join('');

        let role = c.role === "Икона сопротивления" ? "Строитель" : c.role;

        return `
          <div class="chat-block">
            <div class="chat-block__head">
              <strong>${c.randomCipher || c.cipher} · ${role}</strong>
            </div>
            <div class="chat__log" style="max-height:200px; overflow-y:auto; margin-bottom:10px;">
              ${msgsHtml}
            </div>
            <div class="chat__input">
              <input type="text" id="reply-${c.token}" placeholder="Ответить..." />
              <button onclick="sendReply('${c.token}')">Ответить</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function sendReply(token) {
      const inp = document.getElementById('reply-' + token);
      const text = inp.value.trim();
      if (!text) return;
      await fetch(`/api/chat/${token}/reply`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      loadData();
    }

    async function renderVotes() {
      const votesListEl = document.getElementById('votes-list');
      if (!votesListEl) return;
      
      try {
        const r = await fetch('/api/votes');
        if (!r.ok) throw new Error();
        const votesData = await r.json();
        
        if (!cardsData || cardsData.length === 0) {
          votesListEl.innerHTML = '<span style="color:#889">Нет данных.</span>';
          return;
        }
        
        votesListEl.innerHTML = cardsData.map(c => {
          if ((stateData.cards[c.id] || {}).dead) return '';
          const role = c.role === "Икона сопротивления" ? "Строитель (Икона)" : c.role;
          const vote = votesData[c.id];
          let text = "Не голосовал";
          if (vote === null) text = "Воздержался";
          else if (vote !== undefined) {
            const t = cardsData.find(x => x.id === vote);
            text = t ? `За ${t.randomCipher || t.cipher}` : "Неизвестно";
          }
          return `
            <div class="admin__row" style="grid-template-columns: 1fr auto;">
              <div><strong>${c.randomCipher || c.cipher} · ${role}</strong><small>Голос: <span style="color:#69f0ae;">${text}</span></small></div>
            </div>
          `;
        }).join('');
      } catch(e) {
        votesListEl.innerHTML = '<span style="color:red">Ошибка загрузки голосов.</span>';
      }
    }

    async function saveGlobalNotes() {
      const text = document.getElementById('global-notes').value;
      await fetch(`/api/state/global_notes`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes: text })
      });
      const btn = event.target;
      btn.innerText = "Сохранено!";
      setTimeout(() => btn.innerText = "Сохранить заметки", 1500);
    }

    async function toggleState(id, field, value) {
      await fetch(`/api/state/${id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value })
      });
      loadData();
    }

    // --- ОБРАБОТЧИКИ КНОПОК ---
    document.getElementById('mode-select').onchange = async (e) => {
      await fetch('/api/set-mode', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: parseInt(e.target.value) })
      });
      loadData();
    };

    document.getElementById('next-night').onclick = async () => {
      const res = await fetch('/api/next-night', { method: 'POST' });
      const data = await res.json();
      
      if (data.isMassacre) {
        alert("ВНИМАНИЕ! ТРЕТЬЯ НОЧЬ. Ни один мафиози не казнен. Сопротивление устраивает РЕЗНЮ! Они выбирают ДВУХ жертв.");
      }
      
      loadData();
    };

    document.getElementById('toggle-vote').onclick = async () => {
      await fetch('/api/voting-status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isVotingOpen: !votingStatus })
      });
      loadData();
    };

    document.getElementById('reset').onclick = async () => {
      if (!confirm('Сбросить игру и раздать новые роли?')) return;
      await fetch('/api/reset', { method: 'POST' });
      loadData();
    };

    document.getElementById('reset-votes').onclick = async () => {
      await fetch('/api/reset-votes', { method: 'POST' });
      renderVotes();
    };

    // При запуске сразу загружаем данные один раз (без интервала!)
    loadData();
  </script>
</body>
</html>
