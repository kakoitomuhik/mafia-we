<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Единое Государство — Бюро Благодетеля</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }
    .wrapper { max-width: 980px; margin: 0 auto; }
    header {
      background: #121929;
      border: 1px solid #233054;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; color: #60d5ff; }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      background: #233054;
      color: #60d5ff;
    }
    .panel {
      background: #121929;
      border: 1px solid #233054;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-day { background: #ecc94b; color: #1a202c; }
    .btn-vote { background: #dd6b20; color: #fff; }
    .btn-night { background: #4c51bf; color: #fff; }
    .btn-rand { background: #319795; color: #fff; }
    .btn-reset { background: #e53e3e; color: #fff; margin-left: auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .card {
      background: #0b101c;
      border: 1px solid #233054;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.resistance { border-left: 4px solid #ff5277; }
    .card.peaceful { border-left: 4px solid #60d5ff; }
    .cipher-tag {
      display: inline-block;
      background: rgba(96, 213, 255, 0.15);
      color: #60d5ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .copy-btn {
      width: 100%;
      background: #233054;
      color: #60d5ff;
      padding: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div>
        <h1>Бюро Благодетеля (Админка — 10 Нумеров)</h1>
        <small style="color: #718096;">Случайные шифры нумеров • Все 10 ролей</small>
      </div>
      <div id="statusBadge" class="badge">Синхронизация...</div>
    </header>

    <div class="panel">
      <div class="btn-row">
        <button class="btn-day" onclick="setPhase('day')">День ☀️</button>
        <button class="btn-vote" onclick="setPhase('voting')">Голосование 🗳️</button>
        <button class="btn-night" onclick="setPhase('night')">Ночь 🌙</button>
        <button class="btn-rand" onclick="randomizeCiphers()">🎲 Перемешать шифры</button>
        <button class="btn-reset" onclick="resetGame()">Сброс партии 🔄</button>
      </div>
    </div>

    <div class="panel">
      <h2>Карточки нумеров (10 игроков):</h2>
      <div class="grid" id="cardsGrid">Загрузка...</div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
