<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Единое Государство — Бюро Благодетеля</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      line-height: 1.5;
    }
    .wrapper { max-width: 960px; margin: 0 auto; }
    header {
      background: #141b2d;
      border: 1px solid #233054;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; color: #63b3ed; letter-spacing: 0.5px; }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.day { background: #d69e2e; color: #1a202c; }
    .badge.voting { background: #e53e3e; color: #fff; }
    .badge.night { background: #4a5568; color: #fff; }

    .panel {
      background: #141b2d;
      border: 1px solid #233054;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    h2 { font-size: 16px; margin-bottom: 12px; color: #cbd5e0; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-day { background: #ecc94b; color: #1a202c; }
    .btn-vote { background: #dd6b20; color: #fff; }
    .btn-night { background: #4c51bf; color: #fff; }
    .btn-reset { background: #e53e3e; color: #fff; margin-left: auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: #0d1322;
      border: 1px solid #233054;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.builders { border-left: 4px solid #3182ce; }
    .card.resistance { border-left: 4px solid #e53e3e; }
    .card.guardian { border-left: 4px solid #d69e2e; }

    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .card-meta { color: #a0aec0; margin-bottom: 8px; }
    .card-quest {
      background: #141b2d;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      color: #cbd5e0;
    }
    .copy-btn {
      width: 100%;
      background: #233054;
      color: #63b3ed;
      padding: 8px;
      font-size: 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div>
        <h1>Бюро Благодетеля (Панель Ведущего)</h1>
        <small style="color: #718096;">Единое Государство • Скрижаль управления</small>
      </div>
      <div id="statusBadge" class="badge day">Синхронизация...</div>
    </header>

    <div class="panel">
      <h2>Смена предписанной фазы дня</h2>
      <div class="btn-row">
        <button class="btn-day" onclick="setPhase('day')">Часовая Скрижаль: ДЕНЬ ☀️</button>
        <button class="btn-vote" onclick="setPhase('voting')">Единогласное ГОЛОСОВАНИЕ 🗳️</button>
        <button class="btn-night" onclick="setPhase('night')">Опустить шторы: НОЧЬ 🌙</button>
        <button class="btn-reset" onclick="resetGame()">Сброс партии 🔄</button>
      </div>
    </div>

    <div class="panel">
      <h2>Персональные карточки нумеров</h2>
      <div class="grid" id="cardsGrid">Загрузка карточек...</div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
